<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Obscura's ShieldX — Intelligent Identity &amp; Document Risk Screening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink-900:#0B1524;
  --ink-800:#0F1D31;
  --ink-700:#16233A;
  --ink-600:#233350;
  --bg:#F3F6FA;
  --surface:#FFFFFF;
  --border:#E1E7EF;
  --border-soft:#EDF1F6;
  --text:#101828;
  --text-muted:#5C6B84;
  --text-faint:#8894A8;
  --brand:#0AA6A6;
  --brand-dark:#078282;
  --brand-darker:#056868;
  --brand-soft:#E1F6F4;
  --brand-soft-2:#CFF1EE;
  --safe:#178A5A;
  --safe-soft:#E4F8EF;
  --warn:#B5720C;
  --warn-soft:#FCF0D9;
  --danger:#C23434;
  --danger-soft:#FBE7E7;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 16px 40px rgba(11,21,36,.16);
  --radius:12px;
  --radius-sm:8px;
  --sidebar-w:264px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:'Space Grotesk','Inter',sans-serif;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--brand-soft-2);}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
img{max-width:100%;display:block;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-24{gap:24px;}
.w-full{width:100%;}
.text-muted{color:var(--text-muted);}
.text-faint{color:var(--text-faint);}
.text-sm{font-size:13px;} .text-xs{font-size:11.5px;}

/* ---------- buttons & inputs ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:9px;border:1px solid transparent;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s ease;
  white-space:nowrap;line-height:1.2;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--brand-dark);}
.btn-dark{background:var(--ink-900);color:#fff;}
.btn-dark:hover{background:var(--ink-700);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-dark);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--border-soft);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#a52a2a;}
.btn-safe{background:var(--safe);color:#fff;}
.btn-safe:hover{background:#0f6d46;}
.btn-warn{background:var(--warn);color:#fff;}
.btn-warn:hover{background:#8f5a09;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-icon{padding:9px;border-radius:8px;}

label.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;letter-spacing:.01em;}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);font-size:14px;color:var(--text);font-family:inherit;
  transition:.15s;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none;}
.field{margin-bottom:16px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.field-row{grid-template-columns:1fr;}}

/* ---------- cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.card-pad{padding:20px;}
.section-title{font-size:15px;font-weight:700;margin:0 0 4px;}
.section-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.badge-safe{background:var(--safe-soft);color:var(--safe);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-neutral{background:var(--border-soft);color:var(--text-muted);}
.badge-brand{background:var(--brand-soft);color:var(--brand-dark);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* ================= LOGIN ================= */
.login-wrap{min-height:100vh;display:flex;}
.login-aside{
  flex:1.1;background:radial-gradient(circle at 20% 20%,#123047,var(--ink-900) 60%);
  color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.login-aside::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:36px 36px;mask-image:radial-gradient(circle at 30% 30%,black,transparent 75%);
}
.login-aside > *{position:relative;z-index:1;}
.brand-mark{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:20px;}
.brand-glyph{width:34px;height:34px;flex-shrink:0;}
.login-headline{font-family:'Space Grotesk';font-weight:700;font-size:clamp(28px,3.6vw,42px);line-height:1.12;margin:40px 0 14px;max-width:520px;}
.login-copy{color:#B7C4D9;font-size:15px;max-width:440px;line-height:1.6;}
.login-stats{display:flex;gap:36px;margin-top:48px;flex-wrap:wrap;}
.login-stat b{display:block;font-family:'Space Grotesk';font-size:26px;color:#5EEAD4;}
.login-stat span{font-size:12px;color:#8FA0BC;}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg);}
.login-box{width:100%;max-width:400px;}
.login-box h2{font-size:24px;margin:0 0 6px;}
.login-box p.sub{color:var(--text-muted);font-size:13.5px;margin:0 0 28px;}
.demo-creds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px;}
.demo-cred-btn{border:1px dashed var(--border);background:var(--surface);border-radius:8px;padding:9px 6px;font-size:11.5px;text-align:center;cursor:pointer;color:var(--text-muted);transition:.15s;}
.demo-cred-btn:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-soft);}
.login-error{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
@media (max-width:860px){.login-aside{display:none;}}

/* ================= APP SHELL ================= */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--ink-900);color:#CBD5E5;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:60;
  transition:transform .25s ease;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5E7191;padding:14px 10px 6px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.6px;font-weight:500;
  cursor:pointer;margin-bottom:2px;color:#B9C6DC;transition:.12s;
}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(10,166,166,.28),rgba(10,166,166,.06));color:#fff;box-shadow:inset 3px 0 0 var(--brand);}
.sidebar-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#5E7191;}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(8,14,24,.55);z-index:55;}

.main-col{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:64px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40;
}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;margin-right:4px;border-radius:8px;}
.hamburger:hover{background:var(--border-soft);}
.topbar-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:100px;background:var(--border-soft);cursor:pointer;position:relative;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.user-chip .uname{font-size:13px;font-weight:600;line-height:1.1;}
.user-chip .urole{font-size:10.5px;color:var(--text-muted);}
.user-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);width:200px;padding:6px;display:none;z-index:70;}
.user-menu.open{display:block;}
.user-menu button{width:100%;text-align:left;padding:9px 10px;border-radius:7px;border:none;background:none;font-size:13px;cursor:pointer;color:var(--text);}
.user-menu button:hover{background:var(--border-soft);}
.content{padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto;}
@media (max-width:1100px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim.show{display:block;}
  .main-col{margin-left:0;}
  .hamburger{display:inline-flex;align-items:center;}
  .content{padding:18px 16px 48px;}
}

/* ================= dashboard ================= */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:1200px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;}
.stat-card .stat-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-card .stat-val{font-family:'Space Grotesk';font-size:28px;font-weight:700;margin-top:6px;}
.stat-card .stat-delta{font-size:11.5px;margin-top:4px;font-weight:600;}
.stat-card .stat-icon{position:absolute;right:14px;top:14px;opacity:.14;}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
@media (max-width:1000px){.dash-grid{grid-template-columns:1fr;}}
.chart-box{position:relative;height:230px;}
.chart-box-sm{position:relative;height:190px;}
.chart-fallback{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--text-muted);font-size:12.5px;background:var(--bg);border:1px dashed var(--border);border-radius:8px;}

/* ================= tables ================= */
table.data-table{width:100%;border-collapse:collapse;font-size:13.4px;}
table.data-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.data-table td{padding:12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.data-table tbody tr{cursor:pointer;transition:.1s;}
table.data-table tbody tr:hover{background:var(--brand-soft);}
.case-id{font-family:'JetBrains Mono';font-size:12px;color:var(--text-muted);}
@media (max-width:760px){
  table.data-table thead{display:none;}
  table.data-table, table.data-table tbody, table.data-table tr, table.data-table td{display:block;width:100%;}
  table.data-table tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:8px 4px;background:var(--surface);}
  table.data-table td{border:none;padding:6px 12px;display:flex;justify-content:space-between;gap:10px;text-align:right;}
  table.data-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;text-transform:uppercase;letter-spacing:.03em;}
}

/* ================= wizard / pipeline ================= */
.stepper{display:flex;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:0;}
.stepper .step{display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:12.5px;font-weight:700;}
.stepper .step .num{width:26px;height:26px;border-radius:50%;background:var(--border-soft);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:12px;}
.stepper .step.active .num{background:var(--brand);color:#fff;}
.stepper .step.done .num{background:var(--safe);color:#fff;}
.stepper .step.active,.stepper .step.done{color:var(--text);}
.stepper .line{flex:1;height:2px;background:var(--border);margin:0 10px;min-width:24px;}
.stepper .line.done{background:var(--safe);}

.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:700px){.upload-grid{grid-template-columns:1fr;}}
.upload-box{
  border:1.5px dashed var(--border);border-radius:12px;padding:20px;text-align:center;background:var(--bg);
  cursor:pointer;transition:.15s;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.upload-box:hover{border-color:var(--brand);background:var(--brand-soft);}
.upload-box.filled{border-style:solid;border-color:var(--safe);background:var(--safe-soft);}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-box .up-title{font-size:13px;font-weight:700;}
.upload-box .up-sub{font-size:11.5px;color:var(--text-muted);}
.upload-thumb{width:100%;height:90px;object-fit:cover;border-radius:8px;margin-bottom:4px;}

.pipeline{display:flex;flex-direction:column;gap:0;margin:20px 0;}
.pipe-stage{display:flex;gap:14px;padding:14px 4px;position:relative;}
.pipe-stage .rail{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0;}
.pipe-stage .rail .circ{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--border-soft);color:var(--text-faint);flex-shrink:0;transition:.2s;}
.pipe-stage .rail .bar{flex:1;width:2px;background:var(--border);margin:4px 0;min-height:18px;}
.pipe-stage.done .rail .circ{background:var(--safe-soft);color:var(--safe);}
.pipe-stage.active .rail .circ{background:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--brand-soft);}
.pipe-stage.done .rail .bar{background:var(--safe);}
.pipe-stage .body{flex:1;padding-top:2px;}
.pipe-stage .p-title{font-size:13.6px;font-weight:700;}
.pipe-stage .p-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ================= gauge (signature element) ================= */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;}
.gauge-score{font-family:'Space Grotesk';font-size:38px;font-weight:700;margin-top:-46px;}
.gauge-verdict{margin-top:2px;}
.gauge-label{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}

/* ================= misc ================= */
.kv-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;}
@media (max-width:600px){.kv-list{grid-template-columns:1fr;}}
.kv-item{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px dashed var(--border-soft);}
.kv-item .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.kv-item .v{font-size:13.6px;font-weight:600;}
.factor-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.factor-row:last-child{border-bottom:none;}
.factor-name{width:190px;flex-shrink:0;font-size:13px;font-weight:600;}
.factor-bar-track{flex:1;height:8px;border-radius:5px;background:var(--border-soft);overflow:hidden;}
.factor-bar-fill{height:100%;border-radius:5px;}
.factor-pts{width:56px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0;}
@media (max-width:640px){.factor-row{flex-wrap:wrap;}.factor-name{width:100%;}.factor-pts{margin-left:auto;}}

.check-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border-soft);gap:10px;}
.check-row:last-child{border-bottom:none;}
.check-left{display:flex;align-items:center;gap:10px;font-size:13.4px;font-weight:600;}
.check-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{padding:11px 16px;font-size:13.4px;font-weight:600;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--brand-dark);border-bottom-color:var(--brand);}

.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.filter-bar .input{width:auto;min-width:150px;}
.search-input-wrap{position:relative;flex:1;min-width:200px;}
.search-input-wrap .input{padding-left:34px;}
.search-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;}

.modal-scrim{position:fixed;inset:0;background:rgba(11,21,36,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-item::before{content:"";position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--brand);border:3px solid var(--brand-soft);}
.tl-item .tl-title{font-size:13.4px;font-weight:700;}
.tl-item .tl-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.tl-item .tl-note{font-size:12.5px;margin-top:5px;background:var(--bg);border-radius:7px;padding:8px 10px;}

.toast-host{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px;}
.toast{background:var(--ink-900);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast.ok{border-left:3px solid var(--safe);}
.toast.warn{border-left:3px solid var(--warn);}
.toast.err{border-left:3px solid var(--danger);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.progress-track{height:8px;border-radius:5px;background:var(--border-soft);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-dark));border-radius:5px;transition:width .4s ease;}

.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}

/* ---------------------------- deterministic RNG ---------------------------- */
function strHash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngFor(seedStr){ return mulberry32(strHash(seedStr)); }
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function rint(rng, min, max){ return Math.floor(rng()*(max-min+1))+min; }
function fmtDate(d){ const dt = (d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(d){ const dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------------------- verdict helpers ---------------------------- */
function verdictFromScore(score){
  if(score <= 30) return 'Genuine';
  if(score <= 60) return 'Suspicious';
  return 'High Risk';
}
function verdictColorVar(v){
  return v==='Genuine' ? '--safe' : v==='Suspicious' ? '--warn' : '--danger';
}
function verdictBadgeClass(v){
  return v==='Genuine' ? 'badge-safe' : v==='Suspicious' ? 'badge-warn' : 'badge-danger';
}
function statusBadgeClass(s){
  if(s==='Approved') return 'badge-safe';
  if(s==='Rejected') return 'badge-danger';
  if(s==='Escalated') return 'badge-warn';
  return 'badge-brand'; // Pending Review
}

/* ---------------------------- authenticated API helper ---------------------------- */
async function shieldxFetch(url, options = {}) {
  const token = localStorage.getItem('shieldx_access_token');

  if (!token) {
    throw new Error('Authentication required. Please sign in again.');
  }

  const headers = new Headers(options.headers || {});
  headers.set('Authorization', `Bearer ${token}`);

  const response = await fetch(url, {
    ...options,
    headers
  });

  if (response.status === 401) {
    localStorage.removeItem('shieldx_access_token');
    localStorage.removeItem('shieldx_user');

    state.authed = false;
    state.currentUser = null;
    state.view = 'dashboard';

    render();

    throw new Error('Your session has expired. Please sign in again.');
  }

  return response;
}

/* =========================================================================
   DETERMINISTIC "AI" SIMULATION ENGINE
   All scores are derived from a seed string (e.g. applicant name + id
   number) via a seeded RNG so that the same inputs always reproduce the
   same outputs — mirroring a deterministic backend inference call.
   ========================================================================= */
function runOcrExtraction(seed, applicant){
  const rng = rngFor(seed+'|ocr');
  const conf = () => Math.round((0.82 + rng()*0.17)*100);
  return {
    fields: [
      { label:'Full Name', value: applicant.name, confidence: conf(), matchesInput:true },
      { label:'Date of Birth', value: applicant.dob, confidence: conf(), matchesInput:true },
      { label:'Document Number', value: applicant.idNumber, confidence: conf(), matchesInput:true },
      { label:'Nationality', value: applicant.country, confidence: conf(), matchesInput:true },
      { label:'Expiry Date', value: fmtDate(new Date(2026+rint(rng,0,6),rint(rng,0,11),rint(rng,1,28))), confidence: conf(), matchesInput:null },
      { label:'Issuing Authority', value: pick(rng,['Dept. of Immigration','Regional Licensing Office','National Records Office','Passport Office']), confidence: conf(), matchesInput:null },
    ],
    avgConfidence: 0,
  };
}
function runTamperAnalysis(seed){
  const rng = rngFor(seed+'|tamper');
  const risk = rng(); // 0..1
  const checks = [
    { name:'Font & kerning consistency', pass: rng() > risk*0.9 },
    { name:'Edge & border irregularities', pass: rng() > risk*0.9 },
    { name:'Metadata / EXIF consistency', pass: rng() > risk*0.85 },
    { name:'Photo splice / overlay detection', pass: rng() > risk*0.95 },
    { name:'Security pattern & microprint integrity', pass: rng() > risk },
  ];
  const failed = checks.filter(c=>!c.pass).length;
  const score = clamp(Math.round(risk*100 + failed*4), 0, 100);
  return { score, checks, flagged: failed>0 };
}
function runIdentityMatch(seed){
  const rng = rngFor(seed+'|identity');
  const base = 100 - Math.round(rng()*rng()*55);
  return {
    score: clamp(base,40,100),
    fields:[
      { label:'Name across documents', match: rng()>0.12 },
      { label:'Date of birth consistency', match: rng()>0.08 },
      { label:'Document number linkage', match: rng()>0.1 },
      { label:'Address consistency', match: rng()>0.2 },
    ],
  };
}
function runVoiceAnalysis(seed, hasVoice){
  const rng = rngFor(seed+'|voice');
  if(!hasVoice){
    return { provided:false, score:null, classification:'Not Submitted', flags:[] };
  }
  const synthRisk = rng();
  const score = clamp(Math.round(100-synthRisk*100),0,100);
  const classification = score>=70 ? 'Human (Live)' : score>=40 ? 'Uncertain' : 'Likely Synthetic';
  const flags = [
    { name:'Spectral artifact detection', pass: rng() > synthRisk*0.9 },
    { name:'Natural cadence & pitch variance', pass: rng() > synthRisk*0.85 },
    { name:'Background acoustic consistency', pass: rng() > synthRisk*0.8 },
    { name:'Liveness challenge response', pass: rng() > synthRisk },
  ];
  return { provided:true, score, classification, flags };
}
function runSourceVerification(seed){
  const rng = rngFor(seed+'|source');
  return SOURCE_CHECKS_DEF.map(name=>{
    const r = rng();
    const status = r>0.78 ? 'Mismatch' : r>0.62 ? 'Not Found' : 'Verified';
    return { name, status, ref: 'REF-'+rint(rng,100000,999999) };
  });
}
function runLiveness(seed){
  const rng = rngFor(seed+'|liveness');
  const score = clamp(Math.round(60+rng()*40 - rng()*rng()*35),0,100);
  return { score, passed: score>=60 };
}

function computeRiskFusion({ tamper, identity, voice, source, liveness, ocrAvg }){
  const sourceRiskPct = (()=>{
    const bad = source.filter(s=>s.status!=='Verified').length;
    return clamp((bad/source.length)*100, 0, 100);
  })();
  const ocrRiskPct = clamp(100-ocrAvg, 0, 100);
  const voiceRiskPct = voice.provided ? (100-voice.score) : 45; // neutral-ish penalty if not submitted
  const identityRiskPct = 100-identity.score;
  const livenessRiskPct = 100-liveness.score;
  const tamperRiskPct = tamper.score;

  const raw = {
    tamper: tamperRiskPct, ocr: ocrRiskPct, identity: identityRiskPct,
    voice: voiceRiskPct, source: sourceRiskPct, liveness: livenessRiskPct,
  };
  const factors = FACTOR_DEFS.map(f=>{
    const riskPct = raw[f.key];
    const contribution = Math.round((riskPct/100) * f.weight * 10)/10;
    return { ...f, riskPct: Math.round(riskPct), contribution };
  });
  const score = clamp(Math.round(factors.reduce((s,f)=>s+f.contribution,0)), 0, 100);
  const verdict = verdictFromScore(score);
  return { score, verdict, factors };
}

function buildCaseAnalysis(applicant, docs, hasVoice, seedOverride){
  const seed = seedOverride || (applicant.name+'|'+applicant.idNumber);
  const ocr = runOcrExtraction(seed, applicant);
  ocr.avgConfidence = Math.round(ocr.fields.reduce((s,f)=>s+f.confidence,0)/ocr.fields.length);
  const tamper = runTamperAnalysis(seed);
  const identity = runIdentityMatch(seed);
  const voice = runVoiceAnalysis(seed, hasVoice);
  const source = runSourceVerification(seed);
  const liveness = runLiveness(seed);
  const fusion = computeRiskFusion({ tamper, identity, voice, source, liveness, ocrAvg: ocr.avgConfidence });
  return { seed, ocr, tamper, identity, voice, source, liveness, fusion, docs };
}
async function runRealBackendScreening(w){
  const formData = new FormData();

  formData.append('document', w.files.idFront.file);

  if(w.files.selfie){
    formData.append('selfie', w.files.selfie.file);
  }

  if(w.files.crossDoc){
    formData.append('supporting_doc', w.files.crossDoc.file);
  }

  formData.append('applicant_name', w.applicant.name || '');
  formData.append('applicant_dob', w.applicant.dob || '');
  formData.append('applicant_id_number', w.applicant.idNumber || '');
  formData.append('applicant_address', '');

  const response = await fetch(
  '/api/v1/verify/document',
    {
      method:'POST',
      headers: {
  'Authorization': `Bearer ${localStorage.getItem('shieldx_access_token')}`
},
      body:formData
    }
  );

  if(!response.ok){
    let message = `Backend request failed (${response.status})`;

    try{
      const errorData = await response.json();
      if(errorData.detail){
        message = errorData.detail;
      }
    }catch(_){}

    throw new Error(message);
  }

  const backend = await response.json();

  return adaptBackendResultToUi(backend, w);
}

function normalizeFrontendValue(value){
  if(value == null) return '';

  return String(value)
    .toLowerCase()
    .trim()
    .replace(/\s+/g,' ');
}

function buildFrontendDocs(w){
  return [
    w.files.idFront
      ? {
          type:w.docType || 'Identity Document',
          filename:w.files.idFront.name
        }
      : null,

    w.files.idBack
      ? {
          type:(w.docType || 'Identity Document') + ' (back)',
          filename:w.files.idBack.name
        }
      : null,

    w.files.selfie
      ? {
          type:'Selfie Photo',
          filename:w.files.selfie.name
        }
      : null,

    w.files.crossDoc
      ? {
          type:'Supporting Document',
          filename:w.files.crossDoc.name
        }
      : null,
  ].filter(Boolean);
}

function adaptBackendResultToUi(backend,w){
  const documentFields =
    backend.document?.extracted_fields || {};

  const ocrConfidence =
    backend.document?.ocr_confidence != null
      ? Math.round(backend.document.ocr_confidence * 100)
      : 0;

  const ocrFieldDefinitions = [
    ['Full Name','name'],
    ['Date of Birth','date_of_birth'],
    ['Document Number','document_number'],
    ['Gender','gender'],
    ['Address','address'],
  ];

  const ocrFields = ocrFieldDefinitions
    .filter(([,key]) => documentFields[key])
    .map(([label,key]) => ({
      label,
      value:String(documentFields[key]),
      confidence:ocrConfidence,

      matchesInput:
        key === 'name'
          ? normalizeFrontendValue(documentFields[key]) ===
            normalizeFrontendValue(w.applicant.name)

          : key === 'document_number'
            ? normalizeFrontendValue(documentFields[key]) ===
              normalizeFrontendValue(w.applicant.idNumber)

            : null,
    }));

  const anomalyScore =
    Number(backend.explanations?.anomaly_score ?? 0);

  const tamperScore =
    Math.round(anomalyScore * 100);

  const anomalyIndicators =
    backend.anomalies || [];

  const tamperChecks = [
    {
      name:'Document anomaly analysis',
      pass:anomalyIndicators.length === 0
    }
  ];

  const crossDocument =
    backend.cross_document || {
      performed:false,
      score:null,
      classification:'Not Submitted',
      matches:[],
      mismatches:[],
      unavailable:[]
    };

  const identityFields = [];

  (crossDocument.matches || []).forEach(match=>{
    identityFields.push({
      label:match,
      match:true
    });
  });

  (crossDocument.mismatches || []).forEach(mismatch=>{
    identityFields.push({
      label:mismatch,
      match:false
    });
  });

  (crossDocument.unavailable || []).forEach(item=>{
    identityFields.push({
      label:item,
      match:null
    });
  });

  const identityScore =
    crossDocument.score != null
      ? Number(crossDocument.score)
      : 0;

  const crossDocProvided =
    !!crossDocument.performed &&
    !!w.files.crossDoc;

  const crossDocFlags = [];

  (crossDocument.matches || []).forEach(match=>{
    crossDocFlags.push({
      name:match,
      pass:true
    });
  });

  (crossDocument.mismatches || []).forEach(mismatch=>{
    crossDocFlags.push({
      name:mismatch,
      pass:false
    });
  });

  const faceSimilarity =
    backend.face_verification?.similarity;

  const livenessScore =
    faceSimilarity != null
      ? Math.round(Number(faceSimilarity) * 100)
      : 0;

  const livenessChecks = [
    {
      name:'Face similarity',
      pass:
        faceSimilarity != null &&
        Number(faceSimilarity) >= 0.60
    }
  ];

  const source = [
  {
    name:'Authorized Source',
    status:'Not Connected',
    ref:'Not connected'
  }
];

  const riskScore =
    Number.isFinite(Number(backend.risk_score))
      ? Number(backend.risk_score)
      : 0;

  const verdict =
    backend.classification || 'REVIEW_REQUIRED';

  const factorDefinitions = [
    {
      name:'Document Tamper Score',
      riskPct:tamperScore
    },
    {
      name:'OCR Data Consistency',
      riskPct:Math.max(0,100-ocrConfidence)
    },
    {
      name:'Cross-Document Identity Match',
      riskPct:Math.max(0,100-identityScore)
    },
    {
      name:'Cross-Document Verification',
      riskPct:
        crossDocProvided
          ? Math.max(0,100-(Number(crossDocument.score) || 0))
          : 0
    },
    {
      name:'Authorized Source Verification',
      riskPct:0
    },
    {
      name:'Selfie / Liveness Match',
      riskPct:
        faceSimilarity != null
          ? Math.max(0,100-livenessScore)
          : 0
    },
  ];

  const totalRawRisk =
    factorDefinitions.reduce(
      (sum,factor)=>sum + factor.riskPct,
      0
    );

  const factors =
    factorDefinitions.map(factor=>{
      const contribution =
        totalRawRisk > 0
          ? (factor.riskPct / totalRawRisk) * riskScore
          : 0;

      return {
        name:factor.name,
        riskPct:Math.round(factor.riskPct),
        contribution
      };
    });

  return {
    seed:
      backend.request_id ||
      (w.applicant.name + '|' + w.applicant.idNumber),

    ocr:{
      fields:ocrFields,
      avgConfidence:ocrConfidence
    },

    tamper:{
      score:tamperScore,
      checks:tamperChecks,
      flagged:anomalyIndicators.length > 0
    },

    identity:{
      score:identityScore,
      fields:identityFields
    },

    crossDoc:{
      provided:crossDocProvided,
      score:crossDocument.score,
      classification:crossDocument.classification,
      flags:crossDocFlags
    },

     source,

    voice:{
      provided:false,
      score:0,
      classification:'Not Submitted'
    },

    liveness:{
      score:livenessScore,
      checks:livenessChecks
    },

    fusion:{
      score:riskScore,
      verdict,
      factors
    },

    docs:buildFrontendDocs(w),

    backendResponse:backend
  };
}
/* ---------------------------- demo case seeding ---------------------------- */
function seedDemoCases(){
  const cases = [];
  for(let i=0;i<14;i++){
    const rng = rngFor('seed-case-'+i);
    const name = NAMES[i % NAMES.length];
    const country = pick(rng, COUNTRIES);
    const docType = pick(rng, DOC_TYPES);
    const idNumber = (pick(rng,['A','B','C','D','E'])+rint(rng,100000,999999)).toUpperCase();
    const dob = fmtDate(new Date(rint(rng,1965,2002), rint(rng,0,11), rint(rng,1,28)));
    const applicant = { name, dob, idNumber, country };
    const hasVoice = rng() > 0.15;
    const analysis = buildCaseAnalysis(applicant, [
      { type: docType, filename: docType.replace(/[^a-zA-Z]/g,'')+'_front.jpg' },
      { type:'Selfie Photo', filename:'selfie.jpg' },
    ], hasVoice, 'seed-case-'+i);
    const submitted = daysAgo(rint(rng,0,29));
    const analyst = pick(rng, DEMO_USERS.filter(u=>u.role==='Analyst'||u.role==='Administrator'));
    let status = 'Pending Review';
    const roll = rng();
    if(analysis.fusion.verdict==='Genuine') status = roll>0.25 ? 'Approved' : 'Pending Review';
    else if(analysis.fusion.verdict==='Suspicious') status = roll>0.6 ? 'Escalated' : (roll>0.3 ? 'Pending Review':'Approved');
    else status = roll>0.35 ? 'Rejected' : 'Escalated';

    const auditTrail = [
      { time: submitted, actor: analyst.name, role: analyst.role, action:'Screening Submitted', note:`Case created for ${name} (${docType}).` },
      { time: new Date(submitted.getTime()+6*60000), actor:'ShieldX Engine', role:'System', action:'Risk Fusion Complete', note:`Risk score ${analysis.fusion.score} — ${analysis.fusion.verdict}.` },
    ];
    if(status!=='Pending Review'){
      const reviewer = pick(rng, DEMO_USERS.filter(u=>u.role==='Reviewer'||u.role==='Administrator'));
      auditTrail.push({ time: new Date(submitted.getTime()+3600000*rint(rng,1,20)), actor:reviewer.name, role:reviewer.role,
        action: status==='Approved' ? 'Case Approved' : status==='Rejected' ? 'Case Rejected' : 'Case Escalated',
        note: status==='Approved' ? 'Reviewed and confirmed genuine identity.' : status==='Rejected' ? 'Confirmed fraudulent indicators; application rejected.' : 'Escalated for senior review due to conflicting signals.' });
    }
    cases.push({
      id: 'SX-'+(1000+i),
      applicant, docType, submitted, status, analysis,
      riskScore: analysis.fusion.score, riskLevel: analysis.fusion.verdict,
      analyst: analyst.name, reviewer: status!=='Pending Review' ? auditTrail[auditTrail.length-1].actor : null,
      auditTrail,
    });
  }
  cases.sort((a,b)=>b.submitted-a.submitted);
  return cases;
}

function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'ok');
  const ic = type==='err' ? icon('x') : type==='warn' ? icon('alert') : icon('check');
  el.innerHTML = `<span style="opacity:.85">${ic}</span><span>${esc(msg)}</span>`;

function navigate(view, params){

    ? ROLE_PERMISSIONS[state.currentUser.role]

  if(view === 'new-screening' && (!perms || !perms.create)){

    );
    return;
  }

  if(params && params.caseId) {

  }

async function openCase(id){
  const existingCase = state.cases.find(c => c.id === id);

  if(!existingCase){
    toast('Case not found.', 'err');
    return;
  }

  try{
    /*
     * Demo / legacy cases (SX-xxxx) already contain
     * their complete frontend analysis data.
     * Do NOT send them to the backend.
     */
    const isBackendCase =
      typeof id === 'string' &&
      !id.startsWith('SX-');

    if(!isBackendCase){
      navigate('case-detail', { caseId:id });
      return;
    }

    /*
     * Real backend screening:
     * fetch the latest details from PostgreSQL/FastAPI.
     */
    const response = await shieldxFetch(
      `/api/v1/screenings/${encodeURIComponent(id)}`
    );

    if(!response.ok){
      const errorData = await response.json().catch(()=>({}));

      throw new Error(
        errorData.detail ||
        `Failed to load case (${response.status})`
      );
    }

    const detail = await response.json();

    existingCase.backendDetail = detail;

    existingCase.riskScore = detail.risk_score;

    existingCase.riskLevel =
      detail.risk_score >= 70 ? 'High Risk' :
      detail.risk_score >= 30 ? 'Suspicious' :
      'Genuine';

    const backendForUi = {
      ...detail,

      request_id: detail.request_id,
      risk_score: detail.risk_score,
      classification: detail.classification,

      document: {
        ocr_confidence: detail.ocr_confidence,
        extracted_fields: detail.extracted_fields || {},
        raw_text: detail.raw_text || ''
      },

      face_verification: {
        performed:
          detail.face_similarity !== null &&
          detail.face_similarity !== undefined,

        similarity: detail.face_similarity,

        notes:
          detail.face_similarity !== null &&
          detail.face_similarity !== undefined
            ? 'Face verification result received from backend.'
            : 'Selfie not provided.'
      },

      anomalies:
        detail.risk_flags ||
        detail.anomalies ||
        [],

      cross_document:
        detail.cross_document || {
          performed: false,
          score: null,
          classification: 'Not Submitted',
          matches: [],
          mismatches: [],
          unavailable: []
        }
    };

    existingCase.analysis = adaptBackendResultToUi(
      backendForUi,
      {
        applicant: existingCase.applicant || {},
        docType: existingCase.docType || 'Identity Document',
        files: {}
      }
    );

    existingCase.auditTrail = [
      {
        time: new Date(detail.created_at),
        actor: 'ShieldX Engine',
        role: 'System',
        action: 'Screening Completed',
        note:
          `Backend screening completed with risk score ${detail.risk_score}.`
      }
    ];

    navigate('case-detail', { caseId:id });

  }catch(error){
    console.error(
      'ShieldX case detail loading failed:',
      error
    );

    toast(
      error.message ||
      'Unable to load case details from backend.',
      'err'
    );
  }
}

/* =========================================================================
   SHARED COMPONENT: risk gauge (signature element)
   ========================================================================= */
function gaugeSvg(score, size){
  size = size || 200;
  const cx = size/2, cy = size/2, r = size*0.4;
  const startAngle = Math.PI, endAngle = 0; // semicircle, left to right (top half)
  function pt(angle, radius){ return [cx + radius*Math.cos(angle), cy - radius*Math.sin(angle)]; }
  function arcPath(a0, a1, radius){
    const [x0,y0] = pt(a0, radius), [x1,y1] = pt(a1, radius);
    const large = Math.abs(a1-a0) > Math.PI ? 1 : 0;
    return `M ${x0} ${y0} A ${radius} ${radius} 0 ${large} 0 ${x1} ${y1}`;
  }
  // 3 zones over the semicircle: genuine(0-30%), suspicious(30-60%), high(60-100%) mapped across PI..0
  const zones = [
    { from:0, to:0.30, color:'var(--safe)' },
    { from:0.30, to:0.60, color:'var(--warn)' },
    { from:0.60, to:1.0, color:'var(--danger)' },
  ];
  const zonePaths = zones.map(z=>{
    const a0 = Math.PI - z.from*Math.PI, a1 = Math.PI - z.to*Math.PI;
    return `<path d="${arcPath(a0,a1,r)}" stroke="${z.color}" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9"/>`;
  }).join('');
  const needleAngle = Math.PI - (score/100)*Math.PI;
  const needleLen = r*0.86;
  const [nx,ny] = pt(needleAngle, needleLen);
  return `<svg viewBox="0 0 ${size} ${size*0.62}" width="${size}" height="${size*0.62}">
    ${zonePaths}
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink-900)"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink-900)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}
function gaugeBlock(score, verdict, size){
  return `<div class="gauge-wrap">
    ${gaugeSvg(score, size||200)}
    <div class="gauge-score" style="color:var(${verdictColorVar(verdict)})">${score}</div>
    <div class="gauge-verdict"><span class="badge ${verdictBadgeClass(verdict)}">${verdict}</span></div>
    <div class="gauge-label">Composite risk score / 100</div>
  </div>`;
}

   async function loadCasesFromBackend(){
  try{
    const response = await shieldxFetch('/api/v1/screenings?limit=100');

    if(!response.ok){
      const errorData = await response.json().catch(()=>({}));
      throw new Error(
        errorData.detail || `Failed to load screenings (${response.status})`
      );
    }

    const screenings = await response.json();

    state.cases = screenings.map(item => {
  let riskLevel = 'Genuine';

  if(item.risk_score >= 70){
    riskLevel = 'High Risk';
  }else if(item.risk_score >= 30){
    riskLevel = 'Suspicious';
  }

  let status = 'Pending Review';

  if(item.classification === 'LOW_RISK'){
    status = 'Approved';
  }else if(item.classification === 'HIGH_RISK'){
    status = 'Pending Review';
  }else if(item.classification === 'REVIEW_REQUIRED'){
    status = 'Pending Review';
  }

  return {
    id: item.request_id,

    applicant: {
     name: item.applicant_name || 'Applicant',
      dob: item.date_of_birth || '',
      idNumber: item.document_number || '',
      country: item.country || ''
    },

    docType: item.document_type || item.filename || 'Document',

    submitted: new Date(item.created_at),

    status,

    riskScore: item.risk_score,

    riskLevel,

    analyst: 'ShieldX Engine',

    reviewer: null,

        analysis: adaptBackendResultToUi(
      {
        request_id: item.request_id,
        risk_score: item.risk_score,
        classification: item.classification,

        document: {
          ocr_confidence: item.ocr_confidence,
          extracted_fields: item.extracted_fields || {},
          raw_text: item.raw_text || ''
        },

        face_verification: {
          performed:
            item.face_similarity !== null &&
            item.face_similarity !== undefined,

          similarity: item.face_similarity,

          notes:
            item.face_similarity !== null &&
            item.face_similarity !== undefined
              ? 'Face verification result received from backend.'
              : 'Selfie not provided.'
        },

        anomalies: item.risk_flags || [],

        cross_document:
          item.cross_document || {
            performed: false,
            score: null,
            classification: 'Not Submitted',
            matches: [],
            mismatches: [],
            unavailable: []
          }
      },
      {
        applicant: {
          name: item.applicant_name || 'Backend Screening',
          dob: item.date_of_birth || '',
          idNumber: item.document_number || '',
          country: item.country || ''
        },

        docType:
          item.document_type ||
          item.filename ||
          'Document',

        files: {}
      }
    ),

    auditTrail: [
      {
        time: new Date(item.created_at),
        actor: 'ShieldX Engine',
        role: 'System',
        action: 'Screening Completed',
        note: `Backend screening completed with risk score ${item.risk_score}.`
      }
    ]
  };
});

    console.log(
      `ShieldX: loaded ${state.cases.length} real screenings from backend.`
    );

  }catch(error){
    console.error('ShieldX backend loading failed:', error);

    state.cases = seedDemoCases();

    toast(
      'Could not load backend screenings. Showing demo data.',
      'err'
    );
  }
}
async function initApp(){
  logAudit('System Initialized', 'ShieldX workspace initialized.');

  if(state.authed){
    await loadCasesFromBackend();
  }else{
    state.cases = seedDemoCases();
  }

  render();
}

function attachSettingsHandlers(){
  document.querySelectorAll('[data-stab]').forEach(b=> b.addEventListener('click', ()=>{ settingsState.tab = b.dataset.stab; render(); }));
  document.querySelectorAll('[data-perm-role]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      state.settings.rolePerms[cb.dataset.permRole][cb.dataset.permKey] = cb.checked;
      logAudit('RBAC Updated', `${cb.dataset.permKey} for ${cb.dataset.permRole} set to ${cb.checked}.`);
      toast('Permission updated.', 'ok');
    });
  });
  const bindToggle = (id, path)=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', ()=>{ state.settings[path]=el.checked; logAudit('Settings Updated', `${path} set to ${el.checked}.`); toast('Setting saved.','ok'); });
  };
  bindToggle('toggleEncryptionAtRest','encryptionAtRest');
  bindToggle('toggleTls','tlsInTransit');
  bindToggle('toggleMfa','mfaEnabled');
  bindToggle('toggleAnonymize','anonymizeExports');
  bindToggle('toggleConsent','consentRequired');
  const timeoutSlider = document.getElementById('sessionTimeoutSlider');
  if(timeoutSlider) timeoutSlider.addEventListener('input', ()=>{ document.getElementById('sessionTimeoutVal').textContent = timeoutSlider.value+' minutes'; state.settings.sessionTimeoutMin = +timeoutSlider.value; });
  const retentionSlider = document.getElementById('retentionSlider');
  if(retentionSlider) retentionSlider.addEventListener('input', ()=>{ document.getElementById('retentionVal').textContent = retentionSlider.value+' days'; state.settings.retentionDays = +retentionSlider.value; });
  const erasureBtn = document.getElementById('erasureBtn');
  if(erasureBtn) erasureBtn.addEventListener('click', ()=>{
    const id = document.getElementById('erasureCaseSelect').value;
    const c = state.cases.find(x=>x.id===id);
    if(!c) return;
    c.applicant.name = 'ANONYMIZED';
    c.applicant.idNumber = '••••••••';
    c.applicant.dob = '••••••••';
    c.auditTrail.push({ time:new Date(), actor:state.currentUser.name, role:state.currentUser.role, action:'Data Anonymized', note:`Applicant PII anonymized per erasure request for ${id}.` });
    logAudit('Data Anonymized', `PII anonymized for case ${id}.`, id);
    toast(`Case ${id} anonymized.`, 'ok');
    render();
  });
}

  .badge{padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;background:#eee;}</style></head>
  <body>${buildReportHtml(c)}</body></html>`;
  const blob = new Blob([html], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ShieldX_Report_${c.id}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logAudit('Report Generated', `Report downloaded for case ${c.id}.`, c.id);
  toast('Report downloaded.', 'ok');
}

function recordReviewDecision(c, status){
  const noteEl = document.getElementById('caseReviewNote');
  const note = noteEl ? noteEl.value.trim() : '';
  if((status==='Rejected'||status==='Escalated') && !note){
    toast('Please add a reviewer note explaining this decision.', 'err');
    return;
  }
  c.status = status;
  c.reviewer = state.currentUser.name;
  const actionLabel = status==='Approved'?'Case Approved':status==='Rejected'?'Case Rejected':'Case Escalated';
  c.auditTrail.push({ time:new Date(), actor:state.currentUser.name, role:state.currentUser.role, action:actionLabel, note: note || `Marked as ${status.toLowerCase()}.` });
  logAudit(actionLabel, `${c.id}: ${note||'—'}`, c.id);
  toast(`Case ${c.id} marked as ${status}.`, status==='Rejected'?'err':status==='Escalated'?'warn':'ok');
  render();
}

function fileMeta(file){
  return new Promise(resolve=>{
    const sizeLabel = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+' MB' : Math.round(file.size/1024)+' KB';
    const meta = { file, name:file.name, sizeLabel, previewUrl:null };
    if(file.type.startsWith('image/')){
      meta.previewUrl = URL.createObjectURL(file);
    }
    resolve(meta);
  });
}

function attachWizardHandlers(){
  const w = state.wizard;
  document.querySelectorAll('[data-file-input]').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const key = inp.dataset.fileInput;
      const file = e.target.files[0];
      if(!file) return;
      const meta = await fileMeta(file);
      w.files[key] = meta;
      render();
    });
  });
  const nameEl = document.getElementById('wName');
  if(nameEl){
    ['wName','wDob','wIdNumber'].forEach(id=>{
      document.getElementById(id).addEventListener('input', e=>{
        const map = { wName:'name', wDob:'dob', wIdNumber:'idNumber' };
        w.applicant[map[id]] = e.target.value;
      });
    });
    document.getElementById('wCountry').addEventListener('change', e=> w.applicant.country = e.target.value);
    document.getElementById('wDocType').addEventListener('change', e=>{
  w.docType = e.target.value;
  render();
});
  }
  const nextBtn = document.getElementById('wizardNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', startScreeningPipeline);

  const approve = document.getElementById('wizardApprove');
  const escalate = document.getElementById('wizardEscalate');
  const reject = document.getElementById('wizardReject');
  if(approve) approve.addEventListener('click', ()=> finalizeWizardCase('Approved'));
  if(escalate) escalate.addEventListener('click', ()=> finalizeWizardCase('Escalated'));
  if(reject) reject.addEventListener('click', ()=> finalizeWizardCase('Rejected'));
}

function startScreeningPipeline(){
  const w = state.wizard;

  if(!w.applicant.name || !w.applicant.idNumber){
    toast('Please provide at least the applicant name and document number.', 'err');
    return;
  }

  if(!w.files.idFront){
    toast('Please upload the front of the identity document.', 'err');
    return;
  }

  w.docType = w.docType || DOC_TYPES[0];
  w.step = 2;
  w.stageIndex = -1;
  render();
  runNextStage();
}

async function runNextStage(){
  const w = state.wizard;

  w.stageIndex++;
  render();

  if(w.stageIndex >= PIPELINE_STAGES.length - 1){
    try{
      toast('Connecting to ShieldX analysis engine...', 'ok');

      const result = await runRealBackendScreening(w);

      w.result = result;
      w.step = 3;

      render();

      toast('Analysis complete — risk score generated.', 'ok');
    }catch(error){
      console.error('ShieldX backend error:', error);

      toast(
        error.message || 'Unable to connect to ShieldX backend.',
        'err'
      );

      w.step = 1;
      w.stageIndex = -1;
      render();
    }

    return;
  }

  setTimeout(runNextStage, 700);
}
function finalizeWizardCase(status){
  const w = state.wizard;
  const note = document.getElementById('wizardReviewNote').value.trim();
  if((status==='Rejected'||status==='Escalated') && !note){
    toast('Please add a reviewer note explaining this decision.', 'err');
    return;
  }
  const id = w.result.backendResponse?.request_id || w.result.seed;
  const now = new Date();
  const newCase = {
    id,
    applicant: w.applicant,
    docType: w.docType,
    submitted: now,
    status,
    analysis: w.result,
    riskScore: w.result.fusion.score,
    riskLevel: w.result.fusion.verdict,
    analyst: state.currentUser.name,
    reviewer: state.currentUser.name,
    auditTrail: [
      { time: now, actor: state.currentUser.name, role: state.currentUser.role, action:'Screening Submitted', note:`Case created for ${w.applicant.name} (${w.docType}).` },
      { time: new Date(now.getTime()+2000), actor:'ShieldX Engine', role:'System', action:'Risk Fusion Complete', note:`Risk score ${w.result.fusion.score} — ${w.result.fusion.verdict}.` },
      { time: new Date(now.getTime()+4000), actor: state.currentUser.name, role: state.currentUser.role,
        action: status==='Approved'?'Case Approved':status==='Rejected'?'Case Rejected':'Case Escalated',
        note: note || 'Reviewed and confirmed genuine identity.' },
    ],
  };
  state.cases.unshift(newCase);
  logAudit('Case Created', `${id} — ${w.applicant.name} (${w.docType}).`, id);
  logAudit(status==='Approved'?'Case Approved':status==='Rejected'?'Case Rejected':'Case Escalated', `${id}: ${note||'—'}`, id);
  toast(`Case ${id} saved as ${status}.`, status==='Rejected'?'err':status==='Escalated'?'warn':'ok');
  state.wizard = null;
  navigate('case-detail', { caseId:id });
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function renderDashboard(){
  const perms = ROLE_PERMISSIONS[state.currentUser.role];
  const cases = state.cases;
  const total = cases.length;
  const genuine = cases.filter(c=>c.riskLevel==='Genuine').length;
  const suspicious = cases.filter(c=>c.riskLevel==='Suspicious').length;
  const highRisk = cases.filter(c=>c.riskLevel==='High Risk').length;
  const pending = cases.filter(c=>c.status==='Pending Review').length;
  const recent = cases.slice(0,6);

  const statCards = [
    { label:'Total Cases', val: total, delta:`+${cases.filter(c=>(Date.now()-c.submitted)<7*864e5).length} this week`, color:'--brand', icon:'cases' },
    { label:'Genuine', val: genuine, delta: total? Math.round(genuine/total*100)+'% of total':'—', color:'--safe', icon:'shieldcheck' },
    { label:'Suspicious', val: suspicious, delta: total? Math.round(suspicious/total*100)+'% of total':'—', color:'--warn', icon:'alert' },
    { label:'High Risk', val: highRisk, delta: total? Math.round(highRisk/total*100)+'% of total':'—', color:'--danger', icon:'alert' },
    { label:'Pending Review', val: pending, delta: 'Needs reviewer action', color:'--brand-dark', icon:'audit' },
  ];

  return `
  <div class="flex justify-between items-center" style="margin-bottom:18px;flex-wrap:wrap;gap:12px;">
    <div>
      <h2 style="margin:0;font-size:21px;">Welcome back, ${state.currentUser.name.split(' ')[0]}</h2>
      <p class="text-muted text-sm" style="margin:4px 0 0;">Here's what's happening across your screening pipeline.</p>
    </div>
   ${perms.create ? `<button class="btn btn-primary" data-nav="new-screening">${icon('plus')} New Screening</button>` : ''}
  </div>

  <div class="stat-grid">
    ${statCards.map(s=>`
      <div class="stat-card">
        <div class="stat-icon" style="color:var(${s.color})">${icon(s.icon)}</div>
        <div class="stat-label">${s.label}</div>
        <div class="stat-val" style="color:var(${s.color})">${s.val}</div>
        <div class="stat-delta text-muted">${s.delta}</div>
      </div>`).join('')}
  </div>

  <div class="dash-grid">
    <div class="card card-pad">
      <div class="section-title">Screening volume — last 14 days</div>
      <div class="section-sub">Cases submitted per day across all analysts</div>
      <div class="chart-box"><canvas id="chartVolume"></canvas></div>
    </div>
    <div class="card card-pad">
      <div class="section-title">Risk distribution</div>
      <div class="section-sub">Verdict breakdown across all screened cases</div>
      <div class="chart-box"><canvas id="chartRisk"></canvas></div>
    </div>
  </div>

  <div class="dash-grid">
    <div class="card card-pad">
      <div class="section-title">Recent cases</div>
      <div class="section-sub">Latest submissions across the platform</div>
      <div class="scroll-x">
      <table class="data-table">
        <thead><tr><th>Case</th><th>Applicant</th><th>Document</th><th>Risk</th><th>Status</th><th>Submitted</th></tr></thead>
        <tbody>
          ${recent.map(c=>`
            <tr data-open-case="${c.id}">
              <td data-label="Case" class="case-id">${c.id}</td>
              <td data-label="Applicant"><strong>${esc(c.applicant.name)}</strong></td>
              <td data-label="Document">${c.docType}</td>
              <td data-label="Risk"><span class="badge ${verdictBadgeClass(c.riskLevel)}">${c.riskLevel}</span></td>
              <td data-label="Status"><span class="badge ${statusBadgeClass(c.status)}">${c.status}</span></td>
              <td data-label="Submitted" class="text-muted text-sm">${fmtDate(c.submitted)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <div style="text-align:right;margin-top:10px;"><button class="btn btn-outline btn-sm" data-nav="cases">View all cases ${icon('chev')}</button></div>
    </div>
    <div class="card card-pad">
      <div class="section-title">Top source verification signals</div>
      <div class="section-sub">Authorized source check outcomes (30 days)</div>
      <div class="chart-box-sm"><canvas id="chartSources"></canvas></div>
    </div>
  </div>`;
}

/* =========================================================================
   CASE MANAGEMENT — list, search, filters
   ========================================================================= */
function filteredCases(){
  const f = state.filters;
  return state.cases.filter(c=>{
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (c.id+' '+c.applicant.name+' '+c.applicant.idNumber).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f.risk!=='All' && c.riskLevel!==f.risk) return false;
    if(f.status!=='All' && c.status!==f.status) return false;
    if(f.docType!=='All' && c.docType!==f.docType) return false;
    return true;
  });
}

function renderCases(){
  const perms = ROLE_PERMISSIONS[state.currentUser.role];
  const list = filteredCases();
  const f = state.filters;
  return `
  <div class="flex justify-between items-center" style="margin-bottom:16px;flex-wrap:wrap;gap:12px;">
    <div>
      <h2 style="margin:0 0 4px;font-size:21px;">Case Management</h2>
      <p class="text-muted text-sm" style="margin:0;">${list.length} of ${state.cases.length} cases shown</p>
    </div>
    ${perms.create ? `<button class="btn btn-primary" data-nav="new-screening">${icon('plus')} New Screening</button>` : ''}
  </div>

  <div class="card card-pad" style="margin-bottom:16px;">
    <div class="filter-bar">
      <div class="search-input-wrap">
        ${icon('search')}
        <input class="input" id="caseSearch" placeholder="Search by applicant name, case ID or document number…" value="${esc(f.q)}">
      </div>
      <select class="input" id="filterRisk">
        ${['All','Genuine','Suspicious','High Risk'].map(v=>`<option ${f.risk===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <select class="input" id="filterStatus">
        ${['All','Pending Review','Approved','Rejected','Escalated'].map(v=>`<option ${f.status===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <select class="input" id="filterDoc">
        ${['All',...DOC_TYPES].map(v=>`<option ${f.docType===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" id="clearFilters">Clear</button>
    </div>
  </div>

  <div class="card card-pad">
    ${list.length ? `
    <div class="scroll-x">
    <table class="data-table">
      <thead><tr><th>Case ID</th><th>Applicant</th><th>Document</th><th>Risk Score</th><th>Verdict</th><th>Status</th><th>Analyst</th><th>Submitted</th></tr></thead>
      <tbody>
        ${list.map(c=>`
          <tr data-open-case="${c.id}">
            <td data-label="Case ID" class="case-id">${c.id}</td>
            <td data-label="Applicant"><strong>${esc(c.applicant.name)}</strong><div class="text-xs text-faint">${esc(c.applicant.idNumber)}</div></td>
            <td data-label="Document">${c.docType}</td>
            <td data-label="Risk Score"><strong style="color:var(${verdictColorVar(c.riskLevel)})">${c.riskScore}</strong>/100</td>
            <td data-label="Verdict"><span class="badge ${verdictBadgeClass(c.riskLevel)}">${c.riskLevel}</span></td>
            <td data-label="Status"><span class="badge ${statusBadgeClass(c.status)}">${c.status}</span></td>
            <td data-label="Analyst" class="text-sm">${esc(c.analyst)}</td>
            <td data-label="Submitted" class="text-sm text-muted">${fmtDate(c.submitted)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>` : `<div class="empty-state">${icon('cases')}<p>No cases match your filters. Try adjusting search criteria.</p></div>`}
  </div>`;
}

function renderChartsForView(){
  Object.values(state.charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  state.charts = {};
  if(state.view==='dashboard') renderDashboardCharts();
  if(state.view==='case-detail') renderCaseDetailCharts();
}

function renderChartOrFallback(canvasId, chartKey, config, label){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  if(typeof Chart === 'undefined'){
    canvas.parentElement.innerHTML = `<div class="chart-fallback">${label} is unavailable right now.</div>`;
    return;
  }
  try{
    state.charts[chartKey] = new Chart(canvas, config);
  }catch(error){
    console.warn(`ShieldX could not render ${label.toLowerCase()}.`, error);
    canvas.parentElement.innerHTML = `<div class="chart-fallback">${label} could not be loaded.</div>`;
  }
}

function renderDashboardCharts(){
  const days = [];
  const counts = [];
  for(let i=13;i>=0;i--){
    const d = daysAgo(i);
    days.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    const dayKey = d.toDateString();
    counts.push(state.cases.filter(c=>new Date(c.submitted).toDateString()===dayKey).length);
  }
  const volCtx = document.getElementById('chartVolume');
  if(volCtx){
    renderChartOrFallback('chartVolume', 'volume', {
      type:'bar',
      data:{ labels:days, datasets:[{ label:'Cases', data:counts, backgroundColor:'#0AA6A6', borderRadius:5, maxBarThickness:22 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ y:{beginAtZero:true, ticks:{precision:0, font:{size:10.5}}, grid:{color:'#EDF1F6'} }, x:{ ticks:{font:{size:10}}, grid:{display:false} } } }
    }, 'Screening volume chart');
  }
  const riskCtx = document.getElementById('chartRisk');
  if(riskCtx){
    const g = state.cases.filter(c=>c.riskLevel==='Genuine').length;
    const s = state.cases.filter(c=>c.riskLevel==='Suspicious').length;
    const h = state.cases.filter(c=>c.riskLevel==='High Risk').length;
    renderChartOrFallback('chartRisk', 'risk', {
      type:'doughnut',
      data:{ labels:['Genuine','Suspicious','High Risk'], datasets:[{ data:[g,s,h], backgroundColor:['#178A5A','#B5720C','#C23434'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11.5}, usePointStyle:true, pointStyle:'circle' } } } }
    }, 'Risk distribution chart');
  }
  const srcCtx = document.getElementById('chartSources');
  if(srcCtx){
    const tally = {};
    SOURCE_CHECKS_DEF.forEach(s=>tally[s]={Verified:0,'Not Found':0,Mismatch:0});
    state.cases.forEach(c=>{
  if (!c.analysis || !Array.isArray(c.analysis.source)) return;

  c.analysis.source.forEach(s=>{
    if (!s || !s.name || !s.status) return;
    if (!tally[s.name]) return;
    if (tally[s.name][s.status] === undefined) return;

    tally[s.name][s.status]++;
  });
});
    const labels = SOURCE_CHECKS_DEF.map(s=>s.replace(' Database','').replace(' Registry','').replace(' Screen','').replace(' Bureau',''));
    renderChartOrFallback('chartSources', 'sources', {
      type:'bar',
      data:{ labels, datasets:[
        { label:'Verified', data: SOURCE_CHECKS_DEF.map(s=>tally[s].Verified), backgroundColor:'#178A5A' },
        { label:'Not Found', data: SOURCE_CHECKS_DEF.map(s=>tally[s]['Not Found']), backgroundColor:'#B5720C' },
        { label:'Mismatch', data: SOURCE_CHECKS_DEF.map(s=>tally[s].Mismatch), backgroundColor:'#C23434' },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10.5}}}},
        scales:{ x:{ stacked:true, ticks:{font:{size:9.5}}, grid:{display:false} }, y:{ stacked:true, beginAtZero:true, ticks:{precision:0,font:{size:10}}, grid:{color:'#EDF1F6'} } } }
    }, 'Source verification chart');
  }
}
</script>
